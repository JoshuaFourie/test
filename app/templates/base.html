<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0066cc">
  <title>{% block title %}XG Firewall Control{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --xg-blue: #0066cc;
      --xg-blue-light: #1a7fdd;
    }
    body { background: #0d1117; min-height: 100vh; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .navbar-brand { color: #58a6ff !important; font-weight: 700; letter-spacing: 0.5px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    .card-header { background: #1c2128; border-bottom: 1px solid #30363d; }

    /* Rule toggle card */
    .rule-card { transition: box-shadow 0.2s; }
    .rule-card:hover { box-shadow: 0 0 0 1px #58a6ff44; }
    .rule-card.enabled  { border-left: 4px solid #2ea043; }
    .rule-card.disabled { border-left: 4px solid #da3633; }
    .rule-card.unknown  { border-left: 4px solid #6e7681; }

    /* Big toggle switch */
    .form-check-input.rule-toggle {
      width: 3.5rem;
      height: 1.85rem;
      cursor: pointer;
    }
    .form-check-input.rule-toggle:checked { background-color: #2ea043; border-color: #2ea043; }
    .form-check-input.rule-toggle:not(:checked) { background-color: #da3633; border-color: #da3633; }

    .status-badge { font-size: 0.75rem; letter-spacing: 0.5px; }
    .status-badge.enabled  { background: #238636; }
    .status-badge.disabled { background: #b91c1c; }
    .status-badge.unknown  { background: #374151; }

    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast-container { z-index: 9999; }
    .alert-setup { border: 1px solid #d29922; background: #1c1a0a; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">
      <i class="bi bi-shield-fill-check me-2"></i>XG Control
    </a>
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="btn btn-sm btn-outline-secondary {% if request.endpoint == 'index' %}active{% endif %}">
        <i class="bi bi-house-fill"></i>
      </a>
      <a href="/settings" class="btn btn-sm btn-outline-secondary {% if request.endpoint == 'settings' %}active{% endif %}">
        <i class="bi bi-gear-fill"></i>
      </a>
    </div>
  </div>
</nav>

<div class="container py-4 px-3" style="max-width: 680px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'warning' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<!-- Toast for toggle feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="actionToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
